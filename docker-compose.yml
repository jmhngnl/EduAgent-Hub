services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eduagent
      POSTGRES_PASSWORD: eduagent
      POSTGRES_DB: eduagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduagent -d eduagent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${PLATFORM_MYSQL_DATABASE:-eduagent_platform}
      MYSQL_USER: ${PLATFORM_MYSQL_USER:-eduagent}
      MYSQL_PASSWORD: ${PLATFORM_MYSQL_PASSWORD:-eduagent}
      MYSQL_ROOT_PASSWORD: ${PLATFORM_MYSQL_ROOT_PASSWORD:-eduagent-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://eduagent:eduagent@postgres:5432/eduagent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - uploads:/tmp/eduagent_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://eduagent:eduagent@postgres:5432/eduagent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - uploads:/tmp/eduagent_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  platform-server:
    build:
      context: ./platform-server
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${PLATFORM_MYSQL_DATABASE:-eduagent_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: ${PLATFORM_MYSQL_USER:-eduagent}
      SPRING_DATASOURCE_PASSWORD: ${PLATFORM_MYSQL_PASSWORD:-eduagent}
      AGENT_BASE_URL: http://api:8000
      AGENT_API_KEY: ${PLATFORM_AGENT_API_KEY:-}
      AGENT_API_KEYS_FALLBACK: ${API_KEYS:-demo}
      AGENT_CONNECT_TIMEOUT_SECONDS: ${PLATFORM_AGENT_CONNECT_TIMEOUT_SECONDS:-10}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${PLATFORM_AGENT_REQUEST_TIMEOUT_SECONDS:-180}
    ports:
      - "${PLATFORM_SERVER_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      platform-server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mysql_data:
  uploads:
