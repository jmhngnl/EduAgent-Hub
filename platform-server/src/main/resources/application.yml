server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: eduagent-platform-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eduagent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:eduagent}
    password: ${SPRING_DATASOURCE_PASSWORD:eduagent}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  servlet:
    multipart:
      max-file-size: ${PLATFORM_MAX_UPLOAD_MB:30}MB
      max-request-size: ${PLATFORM_MAX_REQUEST_MB:32}MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eduagent:
  agent-base-url: ${AGENT_BASE_URL:http://localhost:8000}
  agent-api-key: ${AGENT_API_KEY:}
  agent-api-keys-fallback: ${AGENT_API_KEYS_FALLBACK:demo}
  agent-connect-timeout-seconds: ${AGENT_CONNECT_TIMEOUT_SECONDS:10}
  agent-request-timeout-seconds: ${AGENT_REQUEST_TIMEOUT_SECONDS:180}
